<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 주변 장소 검색</title>

  <!-- 카카오맵 SDK 불러오기 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8e7647e3a2f83e004b228a7254647882&libraries=services&autoload=false"
    onerror="showMapError()">
  </script>

  <style>
    /* 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    /* 화면을 좌우로 분할 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 380px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #fff;
      z-index: 2;
    }

    .header {
      padding: 24px 20px 18px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: #777;
      font-size: 13px;
    }

    /* 검색창과 버튼 */
    .search-form {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    #searchButton {
      padding: 0 17px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #f4dc00;
    }

    /* 상태 안내 */
    #statusMessage {
      padding: 0 20px 12px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      overflow-y: auto;
      border-top: 1px solid #eee;
    }

    .place-item {
      padding: 17px 20px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fffbea;
    }

    .place-item h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .place-item p {
      margin: 5px 0;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }

    .place-item a {
      display: inline-block;
      margin-top: 8px;
      color: #3867d6;
      font-size: 13px;
      text-decoration: none;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f2f2f2;
    }

    /* 작은 화면 대응 */
    @media (max-width: 650px) {
      .sidebar {
        width: 45%;
        min-width: 190px;
      }

      .header {
        padding: 16px 12px;
      }

      .header h1 {
        font-size: 19px;
      }

      #statusMessage {
        padding: 0 12px 10px;
      }

      .place-item {
        padding: 14px 12px;
      }

      #searchInput {
        padding: 10px;
      }

      #searchButton {
        padding: 0 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 왼쪽: 검색창과 검색 결과 -->
    <aside class="sidebar">
      <header class="header">
        <h1>장소 찾기</h1>
        <p>내 주변의 장소를 검색해 보세요.</p>

        <form class="search-form" id="searchForm">
          <input
            type="text"
            id="searchInput"
            placeholder="예: 카페, 도서관, 맛집"
            aria-label="검색할 장소"
            required
          >
          <button type="submit" id="searchButton">검색</button>
        </form>
      </header>

      <div id="statusMessage" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </div>

      <div id="resultList"></div>
    </aside>

    <!-- 오른쪽: 카카오 지도 -->
    <main id="map" aria-label="장소 검색 지도"></main>
  </div>

  <script>
    // 지도와 검색 기능에서 사용할 변수
    let map = null;
    let placesService = null;
    let infoWindow = null;
    let markers = [];
    let currentPosition = null;
    let isMapReady = false;

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultList = document.getElementById("resultList");
    const statusMessage = document.getElementById("statusMessage");

    // 화면에 상태 메시지를 표시
    function setStatus(message) {
      statusMessage.textContent = message;
    }

    // 카카오맵 SDK 로딩 실패 안내
    function showMapError() {
      setStatus(
        "지도를 불러오지 못했습니다. 인터넷 연결과 카카오 앱 키 및 도메인 설정을 확인해 주세요."
      );
    }

    // 지도를 초기화하고 검색 기능을 준비
    function initializeMap() {
      if (!window.kakao || !kakao.maps) {
        showMapError();
        return;
      }

      try {
        // 기본 위치는 서울시청으로 설정
        const defaultPosition = new kakao.maps.LatLng(
          37.5665,
          126.9780
        );

        const mapContainer = document.getElementById("map");

        // 지도 생성: 확대 레벨 5
        map = new kakao.maps.Map(mapContainer, {
          center: defaultPosition,
          level: 5
        });

        // 지도와 장소 검색 객체 생성
        placesService = new kakao.maps.services.Places(map);
        infoWindow = new kakao.maps.InfoWindow({
          zIndex: 10
        });

        isMapReady = true;
        setStatus("현재 위치를 확인하고 있습니다.");

        // 지도가 만들어진 다음 현재 위치 확인
        getCurrentLocation();

      } catch (error) {
        console.error("지도 초기화 오류:", error);
        showMapError();
      }
    }

    // 브라우저의 위치 권한을 요청
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        setStatus("위치 기능을 지원하지 않아 서울시청을 중심으로 표시합니다.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도를 저장
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          // 지도 중심을 현재 위치로 이동
          map.setCenter(currentPosition);

          // 현재 위치에 마커 표시
          new kakao.maps.Marker({
            map: map,
            position: currentPosition,
            title: "내 현재 위치"
          });

          setStatus("현재 위치를 확인했습니다. 장소를 검색해 보세요.");
        },
        function (error) {
          // 위치 권한을 거부하거나 위치 확인에 실패한 경우
          let message = "현재 위치를 확인할 수 없습니다.";

          if (error.code === error.PERMISSION_DENIED) {
            message = "위치 권한이 거부되었습니다. 서울시청을 중심으로 표시합니다.";
          } else if (error.code === error.TIMEOUT) {
            message = "위치 확인 시간이 초과되었습니다. 서울시청을 중심으로 표시합니다.";
          }

          setStatus(message);
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 이전 검색 결과의 마커를 제거
    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
      infoWindow.close();
    }

    // 장소 하나에 해당하는 마커를 지도에 표시
    function displayMarker(place) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: place.place_name
      });

      markers.push(marker);

      // 마커를 누르면 장소 이름을 표시
      kakao.maps.event.addListener(marker, "click", function () {
        infoWindow.setContent(
          '<div style="padding:10px;font-size:13px;">' +
          escapeHtml(place.place_name) +
          "</div>"
        );

        infoWindow.open(map, marker);
      });
    }

    // HTML에 표시할 문자열을 안전하게 처리
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return entities[character];
      });
    }

    // 검색 결과 하나를 왼쪽 목록에 표시
    function displayPlace(place, index) {
      const item = document.createElement("article");
      item.className = "place-item";

      const title = document.createElement("h3");
      title.textContent = (index + 1) + ". " + place.place_name;

      const category = document.createElement("p");
      category.textContent = place.category_name || "분류 정보 없음";

      const address = document.createElement("p");
      address.textContent =
        place.road_address_name || place.address_name || "주소 정보 없음";

      item.appendChild(title);
      item.appendChild(category);
      item.appendChild(address);

      // 장소 상세 페이지를 새 탭에서 열기
      if (place.place_url) {
        const link = document.createElement("a");
        link.href = place.place_url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "카카오맵에서 보기";
        item.appendChild(link);
      }

      // 결과 항목을 누르면 해당 위치로 이동
      item.addEventListener("click", function (event) {
        if (event.target.closest("a")) {
          return;
        }

        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        map.setCenter(position);
        map.setLevel(3);

        // 해당 장소의 마커를 찾아 정보 표시
        const markerIndex = markers.findIndex(function (marker) {
          const markerPosition = marker.getPosition();

          return (
            markerPosition.getLat() === Number(place.y) &&
            markerPosition.getLng() === Number(place.x)
          );
        });

        if (markerIndex !== -1) {
          const marker = markers[markerIndex];

          infoWindow.setContent(
            '<div style="padding:10px;font-size:13px;">' +
            escapeHtml(place.place_name) +
            "</div>"
          );

          infoWindow.open(map, marker);
        }
      });

      resultList.appendChild(item);
    }

    // 입력한 키워드로 장소 검색
    function searchPlaces(keyword) {
      if (!isMapReady || !placesService) {
        setStatus("지도가 아직 준비되지 않았습니다.");
        return;
      }

      const query = keyword.trim();

      if (!query) {
        setStatus("검색어를 입력해 주세요.");
        return;
      }

      clearMarkers();
      resultList.replaceChildren();
      setStatus("장소를 검색하고 있습니다.");
      searchButton.disabled = true;

      // 현재 위치가 있으면 그 위치를 검색 기준으로 사용
      const options = {
        size: 15
      };

      if (currentPosition) {
        options.location = currentPosition;
        options.sort = kakao.maps.services.SortBy.DISTANCE;
      }

      placesService.keywordSearch(
        query,
        function (data, status) {
          searchButton.disabled = false;

          if (status === kakao.maps.services.Status.OK) {
            setStatus("검색 결과 " + data.length + "개");

            // 검색 결과를 목록과 지도에 함께 표시
            data.forEach(function (place, index) {
              displayMarker(place);
              displayPlace(place, index);
            });

            // 결과가 모두 보이도록 지도 범위를 조정
            const bounds = new kakao.maps.LatLngBounds();

            data.forEach(function (place) {
              bounds.extend(
                new kakao.maps.LatLng(
                  Number(place.y),
                  Number(place.x)
                )
              );
            });

            map.setBounds(bounds);

          } else if (
            status === kakao.maps.services.Status.ZERO_RESULT
          ) {
            setStatus("검색 결과가 없습니다. 다른 검색어를 입력해 보세요.");

          } else {
            setStatus("검색 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
          }
        },
        options
      );
    }

    // 검색 버튼과 Enter 키 처리
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });

    // SDK가 준비된 후 지도 초기화
    if (window.kakao && kakao.maps) {
      kakao.maps.load(initializeMap);
    } else {
      showMapError();
    }
  </script>
</body>
</html>
