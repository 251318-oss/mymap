
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 동네 의료 지도</title>

  <!-- 카카오맵 SDK: JavaScript 키 입력 필요 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_카카오_JavaScript_키_입력&libraries=services"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #263445;
      background: #f4f7fb;
    }

    header {
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: white;
      border-bottom: 1px solid #e4eaf1;
    }

    header h1 {
      font-size: 21px;
      margin: 0;
      color: #2463a6;
    }

    header span {
      margin-left: 12px;
      color: #8290a1;
      font-size: 13px;
    }

    .container {
      display: flex;
      height: calc(100vh - 68px);
      min-height: 500px;
    }

    .sidebar {
      width: 390px;
      flex-shrink: 0;
      padding: 20px;
      background: white;
      overflow-y: auto;
      border-right: 1px solid #e4eaf1;
    }

    .intro {
      margin-bottom: 18px;
    }

    .intro h2 {
      font-size: 21px;
      margin: 0 0 8px;
    }

    .intro p {
      font-size: 13px;
      color: #718096;
      line-height: 1.6;
      margin: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #dce4ee;
      border-radius: 9px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      color: white;
      background: #2868b2;
      border-color: #2868b2;
    }

    .search-row {
      display: flex;
      gap: 7px;
    }

    #searchInput {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d6deea;
      border-radius: 8px;
      font-size: 14px;
    }

    button {
      cursor: pointer;
    }

    #searchButton {
      padding: 0 16px;
      color: white;
      background: #2868b2;
      border: none;
      border-radius: 8px;
      white-space: nowrap;
    }

    #locationButton {
      width: 100%;
      margin-top: 9px;
      padding: 10px;
      border: 1px solid #d6deea;
      border-radius: 8px;
      background: #f8fafc;
      color: #34445a;
    }

    .result-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 10px;
    }

    .result-heading h3 {
      margin: 0;
      font-size: 15px;
    }

    #resultCount {
      color: #718096;
      font-size: 13px;
    }

    #status {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
      margin: 12px 0;
    }

    .result-card {
      padding: 15px 12px;
      margin-bottom: 9px;
      border: 1px solid #e1e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .result-card:hover {
      background: #f4f8fd;
    }

    .result-card.selected {
      border-color: #2868b2;
      background: #edf5ff;
    }

    .place-name {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-address {
      margin: 0 0 7px;
      font-size: 12px;
      color: #66768a;
      line-height: 1.5;
    }

    .place-phone {
      font-size: 12px;
      color: #66768a;
      margin-bottom: 10px;
    }

    .google-link {
      display: inline-block;
      font-size: 12px;
      color: #2168b5;
      text-decoration: none;
      font-weight: bold;
    }

    .google-link:hover {
      text-decoration: underline;
    }

    .map-area {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .map-note {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      z-index: 2;
      padding: 10px 13px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
      box-shadow: 0 2px 8px #00000012;
      pointer-events: none;
    }

    .info-window {
      padding: 8px;
      min-width: 170px;
      font-family: Arial, "Malgun Gothic", sans-serif;
    }

    .info-window strong {
      display: block;
      margin-bottom: 6px;
    }

    .info-window a {
      color: #2168b5;
      font-size: 12px;
      text-decoration: none;
    }

    @media (max-width: 760px) {
      header span {
        display: none;
      }

      .container {
        height: auto;
        min-height: calc(100vh - 68px);
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        border-right: none;
      }

      .map-area {
        flex: none;
        height: 55vh;
        min-height: 350px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>우리 동네 의료 지도</h1>
    <span>병원과 약국을 간편하게 찾아보세요.</span>
  </header>

  <main class="container">
    <section class="sidebar">
      <div class="intro">
        <h2>어디가 아프신가요?</h2>
        <p>주변 의료기관을 검색하고 위치와 추가 정보를 확인하세요.</p>
      </div>

      <div class="tabs">
        <button class="tab active" id="hospitalTab">
          🏥 병원
        </button>
        <button class="tab" id="pharmacyTab">
          💊 약국
        </button>
      </div>

      <div class="search-row">
        <input
          id="searchInput"
          type="text"
          placeholder="지역이나 의료기관 이름 검색"
          aria-label="검색어"
        />
        <button id="searchButton">검색</button>
      </div>

      <button id="locationButton">📍 현재 위치로 이동</button>

      <div class="result-heading">
        <h3>검색 결과</h3>
        <span id="resultCount">0곳</span>
      </div>

      <p id="status">
        지도를 불러온 뒤 검색해 주세요.
      </p>

      <div id="results"></div>
    </section>

    <section class="map-area">
      <div id="map"></div>
      <div class="map-note">
        지도 마커를 누르면 의료기관 정보를 확인할 수 있습니다.
        진료시간과 진료과목은 구글 검색 링크에서 별도로 확인하세요.
      </div>
    </section>
  </main>

  <script>
    // 지도와 검색 기능에 필요한 변수
    let map;
    let placesService;
    let currentCategory = "HP8";
    let markers = [];
    let infoWindow;
    let selectedCard = null;

    const resultsElement = document.getElementById("results");
    const statusElement = document.getElementById("status");
    const countElement = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");

    // 지도 초기화
    function initMap() {
      const defaultPosition = new kakao.maps.LatLng(
        37.5665,
        126.9780
      );

      map = new kakao.maps.Map(
        document.getElementById("map"),
        {
          center: defaultPosition,
          level: 5
        }
      );

      placesService = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

      statusElement.textContent =
        "지역을 검색하거나 현재 위치 버튼을 눌러 주세요.";

      // 현재 위치를 사용할 수 있으면 지도 중심 이동
      moveToCurrentLocation(false);
    }

    // 병원·약국 탭 전환
    document.getElementById("hospitalTab").addEventListener(
      "click",
      function () {
        changeCategory("HP8");
      }
    );

    document.getElementById("pharmacyTab").addEventListener(
      "click",
      function () {
        changeCategory("PM9");
      }
    );

    function changeCategory(category) {
      currentCategory = category;

      document.getElementById("hospitalTab").classList.toggle(
        "active", category === "HP8"
      );

      document.getElementById("pharmacyTab").classList.toggle(
        "active", category === "PM9"
      );

      searchPlaces();
    }

    // 검색 버튼과 Enter 키 처리
    document.getElementById("searchButton").addEventListener(
      "click",
      searchPlaces
    );

    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        searchPlaces();
      }
    });

    // 검색어가 있으면 해당 검색어를 찾고,
    // 없으면 지도 중심 주변의 병원·약국을 찾음
    function searchPlaces() {
      if (!placesService) {
        statusElement.textContent =
          "지도가 아직 준비되지 않았습니다.";
        return;
      }

      const keyword = searchInput.value.trim();

      clearResults();

      statusElement.textContent = "의료기관을 검색하고 있습니다.";

      if (keyword) {
        const query = keyword;

        placesService.keywordSearch(
          query,
          function (data, status) {
            if (status !== kakao.maps.services.Status.OK) {
              statusElement.textContent =
                "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
              return;
            }

            // 선택한 종류에 해당하는 장소만 목록에 표시
            const filteredData = data.filter(function (place) {
              if (currentCategory === "HP8") {
                return place.category_group_code === "HP8" ||
                  place.category_name.includes("병원") ||
                  place.category_name.includes("의원");
              }

              return place.category_group_code === "PM9" ||
                place.category_name.includes("약국");
            });

            if (filteredData.length === 0) {
              statusElement.textContent =
                "해당 종류의 검색 결과가 없습니다.";
              return;
            }

            displayPlaces(filteredData);
          },
          {
            location: map.getCenter(),
            radius: 20000,
            size: 15
          }
        );
      } else {
        // 검색어가 없으면 지도 중심 주변의 의료기관 검색
        placesService.categorySearch(
          currentCategory,
          function (data, status) {
            if (status !== kakao.maps.services.Status.OK) {
              statusElement.textContent =
                "주변 의료기관을 찾지 못했습니다.";
              return;
            }

            displayPlaces(data);
          },
          {
            location: map.getCenter(),
            radius: 20000,
            sort: kakao.maps.services.SortBy.DISTANCE,
            size: 15
          }
        );
      }
    }

    // 기존 검색 결과와 마커 지우기
    function clearResults() {
      resultsElement.replaceChildren();
      markers.forEach(function (marker) {
        marker.setMap(null);
      });

      markers = [];
      selectedCard = null;
      infoWindow.close();
      countElement.textContent = "0곳";
    }

    // HTML 삽입 시 검색 결과 문자열을 안전하게 처리
    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };
        return entities[char];
      });
    }

    // 의료기관 목록과 지도 마커 만들기
    function displayPlaces(places) {
      clearResults();

      statusElement.textContent =
        "검색 결과는 장소 검색 서비스에서 제공한 정보입니다.";

      countElement.textContent = places.length + "곳";

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );

        bounds.extend(position);

        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          title: place.place_name
        });

        markers.push(marker);

        // 구글 검색 링크: API 키 없이 검색 페이지 열기
        const googleQuery = encodeURIComponent(
          place.place_name + " " + place.address_name +
          " 진료시간 진료과목"
        );

        const googleURL =
          "https://www.google.com/search?q=" + googleQuery;

        const card = document.createElement("article");
        card.className = "result-card";

        card.innerHTML = `
          <h4 class="place-name">
            ${escapeHTML(place.place_name)}
          </h4>
          <p class="place-address">
            📍 ${escapeHTML(place.road_address_name || place.address_name)}
          </p>
          <div class="place-phone">
            ${place.phone
              ? "☎ " + escapeHTML(place.phone)
              : "전화번호 정보 없음"}
          </div>
          <a
            class="google-link"
            href="${googleURL}"
            target="_blank"
            rel="noopener noreferrer"
          >
            구글에서 진료정보 확인 ↗
          </a>
        `;

        // 목록 선택 시 해당 마커로 이동
        card.addEventListener("click", function () {
          if (selectedCard) {
            selectedCard.classList.remove("selected");
          }

          selectedCard = card;
          card.classList.add("selected");

          map.panTo(position);

          const infoContent = `
            <div class="info-window">
              <strong>${escapeHTML(place.place_name)}</strong>
              <div style="font-size:12px;margin-bottom:7px;">
                ${escapeHTML(place.address_name)}
              </div>
              <a href="${googleURL}"
                 target="_blank"
                 rel="noopener noreferrer">
                구글에서 추가 정보 확인
              </a>
            </div>
          `;

          infoWindow.setContent(infoContent);
          infoWindow.open(map, marker);
        });

        // 마커를 눌러도 정보창 표시
        kakao.maps.event.addListener(marker, "click", function () {
          if (selectedCard) {
            selectedCard.classList.remove("selected");
          }

          selectedCard = card;
          card.classList.add("selected");

          const infoContent = `
            <div class="info-window">
              <strong>${escapeHTML(place.place_name)}</strong>
              <div style="font-size:12px;margin-bottom:7px;">
                ${escapeHTML(place.address_name)}
              </div>
              <a href="${googleURL}"
                 target="_blank"
                 rel="noopener noreferrer">
                구글에서 추가 정보 확인
              </a>
            </div>
          `;

          infoWindow.setContent(infoContent);
          infoWindow.open(map, marker);
          map.panTo(position);
        });

        resultsElement.appendChild(card);
      });

      // 검색된 장소가 한 곳 이상이면 지도 범위 조정
      if (places.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 현재 위치 가져오기
    document.getElementById("locationButton").addEventListener(
      "click",
      function () {
        moveToCurrentLocation(true);
      }
    );

    function moveToCurrentLocation(shouldSearch) {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "이 브라우저에서는 현재 위치 기능을 지원하지 않습니다.";
        return;
      }

      statusElement.textContent =
        "현재 위치를 확인하고 있습니다.";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          map.setCenter(currentPosition);
          map.setLevel(4);

          statusElement.textContent =
            "현재 위치 주변의 의료기관을 찾을 수 있습니다.";

          if (shouldSearch) {
            searchPlaces();
          }
        },
        function () {
          statusElement.textContent =
            "위치를 가져오지 못했습니다. 위치 권한을 확인하거나 지역을 검색해 주세요.";
        },
        {
          enableHighAccuracy: true,
          timeout: 10000
        }
      );
    }

    // 카카오 지도 SDK 로드가 끝난 후 실행
    window.addEventListener("load", function () {
      if (typeof kakao !== "undefined" && kakao.maps) {
        kakao.maps.load(initMap);
      } else {
        statusElement.textContent =
          "지도를 불러오지 못했습니다. 카카오 JavaScript 키를 확인해 주세요.";
      }
    });
  </script>
</body>
</html>
